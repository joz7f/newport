<body data-root-prefix="">
<div data-include="{{root}}components/nav.html"></div>

<main>
  <section class="hero container grid-12" id="hero">

    <div class="hero-visual">
      <img
        src="assets/images/id_card.webp"
        alt="Joseph Thomas designer ID card"
        fetchpriority="high"
      />
    </div>

    <div class="hero-content">
<div class="hero-heading">
  <h1 class="hero-title">
    UNI<br />
    QUE
  </h1>

  <div class="hero-heading-secondary">
    <div class="word-ticker">
      <div class="word-ticker-track">
        <span>Ideas</span>
        <span>Thoughts</span>
        <span>Designs</span>
        <span>Ideas</span>
        <span>Thoughts</span>
        <span>Designs</span>
      </div>
    </div>
  </div>
</div>

      <p class="hero-description">
        Hey, let me help you with the design.
        I'll make sure to convey the message.
      </p>

      <a href="#contact" class="button">
        Hire Me
      </a>
    </div>

  </section>

  
<div data-include="{{root}}components/projects.html" data-current-project=""></div>



<!-- CONTACT SECTION -->
<section class="contact-section" id="contact">

  <div class="contact-container">

    <!-- Heading -->
    <div class="contact-header">
      <h2>I'd love to work together!</h2>
      <p>
        Let's make this happen. Fill in the details,
        I'll contact you.
      </p>
    </div>

    <!-- Contact Form -->
    <form class="contact-form" id="contact-form">

      <!-- Name and Email -->
      <div class="contact-form-row">

        <div class="form-field">
          <label for="contact-name">Name</label>
          <input
            type="text"
            id="contact-name"
            name="name"
            
            autocomplete="name"
            required
          />
        </div>

        <div class="form-field">
          <label for="contact-email">E-mail</label>
          <input
            type="email"
            id="contact-email"
            name="email"
            
            autocomplete="email"
            required
          />
        </div>

      </div>

      <!-- Project Type -->
      <div class="form-field">
        <label for="project-type">
          You're Interested In
        </label>

        <select
          id="project-type"
          name="project-type"
          required
        >
          <option value="" disabled selected>
            Select a project type
          </option>
          <option value="UI/UX Design">UI/UX Design</option>
          <option value="Website Design">Website Design</option>
          <option value="Graphic Design">Graphic Design</option>
          <option value="Motion Design">Motion Design</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Project Details -->
      <div class="form-field">
        <label for="project-message">
          More about the project
        </label>

        <textarea
          id="project-message"
          name="message"
        
          rows="5"
          required
        ></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" class="contact-submit">
        <span>Submit</span>
      </button>

    </form>

  </div>

</section>

</main>
  
<div data-include="{{root}}components/footer.html"></div>

    <script src="script.js" defer></script>
    
    
</body>


</html>
